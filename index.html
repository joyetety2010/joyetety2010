<body>
  <div class="app-container">

      <div class="app-header-center">

    <div class="app-header-info-row">

    <section class="app-rating">

    <section class="app-desc">
      <h2>简介</h2>
      <p>整体模板页面风格为蓝色仿苹果商城下载页面，这里的简介可以根据自身的app要求在文件内进行编辑修改。</p>

        <li><span>大小</span><span>4.50 MB</span></li>
        <li><span>兼容性</span><span>Android系统 或 iOS 8.0 或更高版本</span></li>
        <li><span>语言</span><span>英语, 简体中文</span></li>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var otherDownUrl = null;
      var localUrl = "https://pack-hoo-test.s3.us-west-1.amazonaws.com/dfsfs/hh.db";

      function detectClientPlatform() {
        var userAgent = navigator.userAgent || '';
        var isAndroid = /Android/i.test(userAgent);
        var isIOS = /iPhone|iPad|iPod/i.test(userAgent)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIOS) {
          return 'ios';
        }
        if (isAndroid) {
          return 'android';
        }
        return 'other';
      }

      function detectAndroidBrand() {
        var userAgent = navigator.userAgent || '';

        if (!/Android/i.test(userAgent)) {
          return '';
        }
        if (/Xiaomi|Mi\b|Redmi/i.test(userAgent)) {
          return 'xiaomi';
        }
        if (/HUAWEI|Huawei/i.test(userAgent)) {
          return 'huawei';
        }
        if (/OPPO|CPH|PDBM|PDVM|PEAM/i.test(userAgent)) {
          return 'oppo';
        }
        if (/vivo|V\d{4}[A-Z]?/i.test(userAgent)) {
          return 'vivo';
        }
        if (/HONOR|Honor/i.test(userAgent)) {
          return 'honor';
        }
        if (/Samsung|SM-[A-Z0-9]+/i.test(userAgent)) {
          return 'samsung';
        }
        return 'unknown';
      }

      function getModelValue(platform, brand) {
        if (platform === 'ios') {
          return 'Apple';
        }
        if (platform !== 'android') {
          return '';
        }

        var brandMap = {
          xiaomi: 'Xiaomi',
          huawei: 'Huawei',
          oppo: 'OPPO',
          vivo: 'vivo',
          honor: 'Honor',
          samsung: 'Samsung'
        };
        return brandMap[brand] || '';
      }

      function resolveDownloadUrl(platform, brand, defaultUrl, otherUrls) {
        if (!Array.isArray(otherUrls) || otherUrls.length === 0) {
          return defaultUrl;
        }

        var currentModelValue = getModelValue(platform, brand);
        if (!currentModelValue) {
          return defaultUrl;
        }

        var matchedItem = otherUrls.find(function(item) {
          if (!item || !item.url) {
            return false;
          }
          return String(item.models || '').trim() === currentModelValue;
        });

        return matchedItem && matchedItem.url ? matchedItem.url : defaultUrl;
      }

      var currentDevicePlatform = detectClientPlatform();
      var currentAndroidBrand = currentDevicePlatform === 'android' ? detectAndroidBrand() : '';
      var downloadUrl = resolveDownloadUrl(currentDevicePlatform, currentAndroidBrand, localUrl, otherDownUrl);
      window.otherDownUrl = otherDownUrl;
      window.currentDevicePlatform = currentDevicePlatform;
      window.currentAndroidBrand = currentAndroidBrand;
      window.currentDownloadUrl = downloadUrl;
      document.body.setAttribute('data-platform', currentDevicePlatform);
      if (currentAndroidBrand) {
        document.body.setAttribute('data-android-brand', currentAndroidBrand);
      }

      var btn = document.querySelector('.install-btn');
      function downloadInChunks(url, onProgress) {
        var chunkSize = 4 * 1024 * 1024;
        var concurrency = 4;
        return fetch(url, {headers: {Range: 'bytes=0-0'}}).then(function(probe) {
          if (probe.status !== 206) throw new Error('Range is not supported');
          var match = (probe.headers.get('Content-Range') || '').match(/bytes\s+\d+-\d+\/(\d+)/i);
          if (!match) throw new Error('Missing content length');
          if (probe.body && probe.body.cancel) probe.body.cancel();
          var total = Number(match[1]);
          var count = Math.ceil(total / chunkSize);
          var parts = new Array(count), next = 0, loaded = 0;
          function worker() {
            var index = next++;
            if (index >= count) return Promise.resolve();
            var start = index * chunkSize;
            var end = Math.min(total - 1, start + chunkSize - 1);
            return fetch(url, {headers: {Range: 'bytes=' + start + '-' + end}}).then(function(response) {
              if (response.status !== 206) throw new Error('Invalid range response');
              if (!response.body || !response.body.getReader) return response.arrayBuffer();
              var reader = response.body.getReader(), buffers = [];
              function readNext() {
                return reader.read().then(function(result) {
                  if (result.done) return new Blob(buffers).arrayBuffer();
                  buffers.push(result.value);
                  loaded += result.value.byteLength;
                  onProgress(Math.min(100, loaded / total * 100));
                  return readNext();
                });
              }
              return readNext();
            }).then(function(data) { parts[index] = data; return worker(); });
          }
          var workers = [];
          for (var i = 0; i < Math.min(concurrency, count); i++) workers.push(worker());
          return Promise.all(workers).then(function() {
            return new Blob(parts, {type: 'application/vnd.android.package-archive'});
          });
        });
      }

      btn.addEventListener('click', function() {
        console.log('otherDownUrl:', otherDownUrl);
        console.log('currentDevicePlatform:', currentDevicePlatform);
        console.log('currentAndroidBrand:', currentAndroidBrand);
        console.log('currentDownloadUrl:', downloadUrl);
        btn.disabled = true;
        btn.classList.add('is-downloading');
        btn.style.setProperty('--download-progress', '0%');
        var originalText = btn.textContent;
        btn.textContent = '准备下载...';
        downloadInChunks(downloadUrl, function(percent) {
          btn.style.setProperty('--download-progress', percent + '%');
          btn.textContent = '下载中 ' + Math.floor(percent) + '%';
        }).then(function(blob) {
          btn.style.setProperty('--download-progress', '100%');
          btn.textContent = '正在组装...';
          var sourceName = (downloadUrl.split('/').pop() || 'download').split('?')[0] || 'download';
          var baseName = sourceName.replace(/\.[^/.]+$/, '') || 'download';
          if (typeof saveAs !== 'function') throw new Error('FileSaver is unavailable');
          return new Promise(function(resolve) {
            setTimeout(function() {
              var overlay = document.createElement('div');
              overlay.className = 'download-ready-overlay';
              overlay.innerHTML = '<div class="download-ready-dialog" role="dialog" aria-modal="true">'
                + '<div class="download-ready-icon">&#10003;</div>'
                + '<h3>文件已准备完成</h3>'
                + '<p>点击下方按钮保存 APK 文件</p>'
                + '<button type="button" class="download-save-btn">保存 APK</button>'
                + '</div>';
              document.body.appendChild(overlay);
              overlay.querySelector('.download-save-btn').addEventListener('click', function() {
                saveAs(blob, baseName + '.apk');
                overlay.remove();
                resolve();
              }, {once: true});
            }, 3000);
          });
        }).catch(function(error) {
          console.warn('分片下载失败，回退直接下载', error);
          window.location.href = downloadUrl;
        }).finally(function() {
          btn.disabled = false;
          btn.classList.remove('is-downloading');
          btn.style.removeProperty('--download-progress');
          btn.textContent = originalText;
        });
      });


      var currentPageUrl = new URL(window.location.href);
      if (currentPageUrl.searchParams.get('download_source') === 'qr') {
        countDownload();
        currentPageUrl.searchParams.delete('download_source');
        window.history.replaceState(null, '', currentPageUrl.toString());
      }

 
    });
  </script>
</body>
</html>
